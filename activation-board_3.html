<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Activation Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0D13; --bg-grid:rgba(255,255,255,0.025);
    --surface:#12161F; --surface-2:#171C27; --surface-hover:#1A2029;
    --line:#232A38; --line-soft:#1B212C;
    --ink:#E8EAF0; --ink-soft:#8D96AC; --ink-faint:#5B6478;
    --blue:#4FA8FF; --blue-bg:rgba(79,168,255,0.14);
    --cyan:#35D6C4; --cyan-bg:rgba(53,214,196,0.14);
    --amber:#FFB454; --amber-bg:rgba(255,180,84,0.16);
    --green:#3DDC84; --green-bg:rgba(61,220,132,0.15);
    --red:#FF5C6C; --red-bg:rgba(255,92,108,0.15);
    --purple:#A78BFA;
    --grey:#7C859B; --grey-bg:rgba(124,133,155,0.16);
    --radius:10px;
    --shadow:0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      linear-gradient(var(--bg-grid) 1px, transparent 1px) 0 0/100% 32px,
      linear-gradient(90deg, var(--bg-grid) 1px, transparent 1px) 0 0/32px 100%,
      var(--bg);
    color:var(--ink);font-family:'IBM Plex Sans',sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;
  }
  #app{max-width:1560px;margin:0 auto;padding:26px 26px 80px;}
  button{font-family:inherit;cursor:pointer;}
  input,select{font-family:inherit;font-size:13px;color:var(--ink);}
  :focus-visible{outline:2px solid var(--blue);outline-offset:2px;}
  @media (prefers-reduced-motion:reduce){*{transition:none !important;}}

  .topbar{height:3px;background:linear-gradient(90deg,var(--blue),var(--cyan),var(--green),var(--amber));margin:-26px -26px 24px;}
  .header{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:16px;margin-bottom:22px;}
  .wordmark{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:26px;letter-spacing:-0.01em;margin:0;display:flex;align-items:center;gap:9px;}
  .wordmark .dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green);}
  .tagline{color:var(--ink-soft);font-size:12.5px;margin-top:4px;}
  .sync-note{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;color:var(--ink-soft);background:var(--surface);border:1px solid var(--line);padding:7px 13px;border-radius:20px;font-family:'JetBrains Mono',monospace;}
  .sync-dot{width:6px;height:6px;border-radius:50%;background:var(--green);flex:none;box-shadow:0 0 6px var(--green);}
  .sync-dot.warn{background:var(--red);box-shadow:0 0 6px var(--red);}
  .storage-warning{background:var(--red-bg);color:var(--red);border:1px solid var(--red);border-radius:var(--radius);padding:10px 16px;font-size:12.5px;margin-bottom:18px;}

  .tabs{display:flex;gap:20px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:24px;}
  .tab{position:relative;display:flex;align-items:center;gap:6px;padding:0 0 12px;background:none;border:none;font-size:11.5px;letter-spacing:0.05em;text-transform:uppercase;color:var(--ink-soft);font-weight:600;white-space:nowrap;font-family:'IBM Plex Sans';}
  .tab.active{color:var(--ink);}
  .tab.active::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--blue);box-shadow:0 0 8px var(--blue);}
  .tab-rename-btn{opacity:0;border:none;background:none;color:var(--ink-faint);font-size:11px;padding:2px;line-height:1;}
  .tab:hover .tab-rename-btn,.tab:focus-within .tab-rename-btn{opacity:1;}
  .tab-rename-input{font:600 12px 'IBM Plex Sans';border:none;border-bottom:1px solid var(--blue);background:transparent;width:140px;padding:0 0 12px;color:var(--ink);}

  .stat-strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-bottom:14px;}
  .stat-card{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--grey);border-radius:var(--radius);padding:12px 14px;box-shadow:var(--shadow);}
  .stat-num{font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:600;}
  .stat-label{font-size:10px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.05em;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .stat-card.c-grey{border-left-color:var(--grey);} .stat-card.c-amber{border-left-color:var(--amber);}
  .stat-card.c-blue{border-left-color:var(--blue);} .stat-card.c-green{border-left-color:var(--green);}

  .section-row{display:flex;justify-content:space-between;align-items:center;margin:24px 0 12px;}
  .section-title{font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:600;margin:0;letter-spacing:-0.01em;}
  .btn{display:inline-flex;align-items:center;gap:6px;background:var(--blue);color:#06101C;border:none;border-radius:8px;padding:8px 15px;font-size:12.5px;font-weight:600;letter-spacing:0.01em;}
  .btn.secondary{background:var(--surface);color:var(--ink);border:1px solid var(--line);}
  .btn:hover{filter:brightness(1.1);}

  .upcoming-list{display:flex;flex-direction:column;gap:7px;}
  .upcoming-row{display:grid;grid-template-columns:130px 1.8fr 100px 130px 130px 100px;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:11px 15px;box-shadow:var(--shadow);cursor:pointer;}
  .upcoming-row:hover{border-color:var(--blue);}
  .upcoming-row.overdue{border-left:3px solid var(--red);}
  .group-pill{font-size:9.5px;font-weight:700;letter-spacing:0.03em;text-transform:uppercase;padding:3px 8px;border-radius:6px;color:#06101C;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .row-main .brand{font-weight:600;font-size:13.5px;}
  .row-main .name{color:var(--ink-soft);font-size:12px;}
  .row-month{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--ink-soft);}
  .badge{display:inline-block;font-size:10.5px;font-weight:600;padding:4px 9px;border-radius:6px;white-space:nowrap;}
  .countdown{font-size:11px;font-weight:600;text-align:right;font-family:'JetBrains Mono',monospace;}
  .countdown.overdue{color:var(--red);}
  .countdown.now{color:var(--green);}
  .countdown.soon{color:var(--amber);}
  .bd-flag{font-size:9px;color:var(--amber);border:1px solid var(--amber);border-radius:4px;padding:1px 4px;margin-left:4px;}
  .empty-note{color:var(--ink-soft);font-size:13px;padding:18px;background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius);}

  .as-blank,.es-blank{background:var(--grey-bg);color:var(--grey);}
  .as-to-be-sent{background:var(--amber-bg);color:var(--amber);}
  .as-feedback-received{background:var(--blue-bg);color:var(--blue);}
  .as-approved{background:var(--cyan-bg);color:var(--cyan);}
  .as-done{background:var(--green-bg);color:var(--green);font-weight:700;}
  .es-to-be-executed{background:var(--amber-bg);color:var(--amber);}
  .es-done{background:var(--green-bg);color:var(--green);font-weight:700;}

  .group-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px;}
  .group-title-row{display:flex;align-items:center;gap:8px;}
  .group-title{font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:700;margin:0;letter-spacing:-0.01em;}
  .group-count{color:var(--ink-soft);font-size:12px;font-family:'JetBrains Mono',monospace;}
  .group-count .warn{color:var(--red);}
  .icon-btn{border:none;background:none;color:var(--ink-faint);font-size:13px;padding:4px;}
  .icon-btn:hover{color:var(--ink);}

  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
  .toolbar input[type="text"]{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;color:var(--ink);min-width:220px;}
  .toolbar select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--ink);}
  .toolbar label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-soft);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 12px;}
  .toolbar .reset-link{font-size:12px;color:var(--blue);background:none;border:none;text-decoration:underline;}
  .result-count{font-size:11.5px;color:var(--ink-faint);font-family:'JetBrains Mono',monospace;margin-left:2px;}

  .table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow);}
  table{border-collapse:collapse;width:100%;min-width:1750px;}
  thead th{position:sticky;top:0;background:var(--surface-2);text-align:left;font-size:9.5px;text-transform:uppercase;letter-spacing:0.04em;color:var(--ink-soft);font-weight:600;padding:11px 8px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:3;}
  tbody td{padding:5px 7px;border-bottom:1px solid var(--line-soft);vertical-align:middle;}
  tbody tr.main-row:hover{background:var(--surface-hover);}
  tbody tr.row-overdue{background:rgba(255,92,108,0.05);}
  td input[type="text"],td input[type="number"]{width:100%;min-width:80px;border:1px solid transparent;background:transparent;border-radius:6px;padding:6px 6px;color:var(--ink);}
  td input:hover{border-color:var(--line);}
  td input:focus{border-color:var(--blue);background:var(--surface-2);}
  td select{background:transparent;border:1px solid transparent;border-radius:6px;padding:6px 6px;color:var(--ink);}
  td select:hover{border-color:var(--line);}
  td select.status-select{appearance:none;border:1px solid transparent;border-radius:6px;padding:6px 9px;font-weight:600;font-size:11px;min-width:118px;}
  td select.status-select:hover{border-color:var(--line);}
  .col-brand{position:sticky;left:0;background:var(--surface);z-index:2;box-shadow:2px 0 6px rgba(0,0,0,0.35);}
  tbody tr.main-row:hover .col-brand{background:var(--surface-hover);}
  tbody tr.row-overdue .col-brand{background:#171319;}
  .col-brand input{font-weight:600;min-width:120px;}
  .overdue-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--red);box-shadow:0 0 5px var(--red);margin-right:5px;}
  .col-product input{min-width:150px;}
  .del-btn{border:none;background:none;color:var(--ink-faint);font-size:16px;line-height:1;padding:4px 6px;border-radius:6px;}
  .del-btn:hover{color:var(--red);background:var(--red-bg);}
  .bd-toggle{border:1px solid var(--line);background:transparent;border-radius:20px;padding:5px 10px;font-size:11px;color:var(--ink-soft);white-space:nowrap;font-family:'JetBrains Mono',monospace;}
  .bd-toggle:hover{border-color:var(--amber);color:var(--ink);}
  .bd-toggle.has-bd{background:var(--amber-bg);color:var(--amber);border-color:transparent;font-weight:600;}
  .bd-detail-row td{background:var(--surface-2);padding:12px 16px;}
  .bd-detail-table{width:100%;border-collapse:collapse;}
  .bd-detail-table th{text-align:left;font-size:9px;text-transform:uppercase;color:var(--ink-soft);padding:5px 6px;}
  .bd-detail-table td{padding:3px 6px;border-bottom:1px solid var(--line-soft);}
  .bd-detail-table input{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:5px;padding:4px 6px;font-size:12px;}
  .bd-add-row{margin-top:6px;}
  .bd-empty{color:var(--ink-soft);font-size:12px;padding:4px 0;}

  .full-table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow);}
  .full-table{width:100%;border-collapse:collapse;min-width:1000px;}
  .full-table th{text-align:left;font-size:9.5px;text-transform:uppercase;letter-spacing:0.03em;color:var(--ink-soft);padding:10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2);}
  .full-table td{padding:9px 10px;border-bottom:1px solid var(--line-soft);font-size:12.5px;}
  .full-table tr:last-child td{border-bottom:none;}
  .full-table tr{cursor:pointer;}
  .full-table tr:hover{background:var(--surface-hover);}
  .full-table tr.overdue td:first-child{box-shadow:inset 3px 0 0 var(--red);}

  @media (max-width:900px){
    .stat-strip{grid-template-columns:repeat(2,1fr);}
    .upcoming-row{grid-template-columns:90px 1fr 70px;}
    .upcoming-row .row-month,.upcoming-row .badge:nth-of-type(2){display:none;}
  }
</style>
</head>

<script>
(function(){
  const GROUP_TAG_COLORS = ['#4FA8FF','#35D6C4','#3DDC84','#FFB454','#FF5C6C','#A78BFA','#F472B6','#60E1E0'];
  const APPROVAL_OPTIONS = ['', 'To be Sent', 'Feedback Received', 'Approved', 'Done'];
  const EXECUTION_OPTIONS = ['', 'To be Executed', 'Done'];

  function buildMonthOptions(){
    const opts = [];
    for(let y = 2025; y <= 2028; y++){
      for(let m = 0; m < 12; m++){
        const mm = String(m+1).padStart(2,'0');
        opts.push({ value: `${y}-${mm}-01`, label: new Date(y,m,1).toLocaleDateString('en-US',{month:'long', year:'numeric'}) });
      }
    }
    return opts;
  }
  const MONTH_OPTIONS = buildMonthOptions();

  const state = {
    groups: [], activations: [], activeTab: 'overview', renamingGroupId: null, justAddedId: null,
    storageOk: true, expanded: new Set(),
    filter: { search:'', approval:'__ALL__', execution:'__ALL__', overdueOnly:false }
  };

  const slug = s => String(s||'blank').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'') || 'blank';
  const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,7);

  async function loadKey(key, fallbackFn){
    try{
      const res = await window.storage.get(key, true);
      if(res && res.value) return JSON.parse(res.value);
      throw new Error('empty');
    }catch(e){
      const fallback = fallbackFn();
      try{ await window.storage.set(key, JSON.stringify(fallback), true); }catch(e2){ state.storageOk = false; }
      return fallback;
    }
  }
  async function saveGroups(){ try{ await window.storage.set('groups', JSON.stringify(state.groups), true); }catch(e){ state.storageOk=false; } }
  async function saveActivations(){ try{ await window.storage.set('activations', JSON.stringify(state.activations), true); }catch(e){ state.storageOk=false; } }

  async function init(){
    state.groups = await loadKey('groups', () => SEED_DATA.groups);
    state.activations = await loadKey('activations', () => SEED_DATA.activations);
    render();
  }

  function lastUpdated(){
    let max = null;
    state.activations.forEach(a => { if(a.updatedAt && (!max || a.updatedAt > max)) max = a.updatedAt; });
    return max;
  }
  function timeAgo(iso){
    if(!iso) return 'now';
    const diff = Date.now() - new Date(iso).getTime();
    const m = Math.floor(diff/60000);
    if(m < 1) return 'just now';
    if(m < 60) return m + 'm ago';
    const h = Math.floor(m/60);
    if(h < 24) return h + 'h ago';
    return Math.floor(h/24) + 'd ago';
  }
  function groupName(id){ const g = state.groups.find(g=>g.id===id); return g? g.name : id; }
  function groupColor(id){ const idx = state.groups.findIndex(g=>g.id===id); return GROUP_TAG_COLORS[idx % GROUP_TAG_COLORS.length]; }
  function monthLabel(m){ if(!m) return '—'; const d = new Date(m+'T00:00:00'); if(isNaN(d)) return m; return d.toLocaleDateString('en-US',{month:'short',year:'numeric'}); }
  function monthIndex(m){ const d = new Date(m+'T00:00:00'); if(isNaN(d)) return null; return d.getFullYear()*12 + d.getMonth(); }
  function currentMonthIndex(){ const t = new Date(); return t.getFullYear()*12 + t.getMonth(); }
  function isOverdue(a){ const idx = monthIndex(a.month); if(idx === null) return false; return idx < currentMonthIndex() && a.executionStatus !== 'Done'; }
  function options(list, current){ return list.map(o => `<option value="${esc(o)}" ${o===current?'selected':''}>${o===''?'—':esc(o)}</option>`).join(''); }
  function monthOptionsHtml(current){
    let found = MONTH_OPTIONS.some(o => o.value === current);
    let extra = (!found && current) ? `<option value="${esc(current)}" selected>${esc(monthLabel(current))}</option>` : '';
    return extra + MONTH_OPTIONS.map(o => `<option value="${o.value}" ${o.value===current?'selected':''}>${o.label}</option>`).join('');
  }

  function bdSummary(skus){
    if(!skus || !skus.length) return {text:'—', has:false};
    const nums = skus.filter(s => s.value !== '' && !isNaN(Number(s.value)));
    if(nums.length === skus.length){
      const sum = nums.reduce((t,s) => t + Number(s.value), 0);
      return {text: `${skus.length} SKU${skus.length===1?'':'s'} · ${sum} units`, has:true};
    }
    const counts = {};
    skus.forEach(s => { const k = s.value || '—'; counts[k] = (counts[k]||0)+1; });
    return {text: Object.entries(counts).map(([k,v]) => `${v} ${k}`).join(' · '), has:true};
  }

  function matchesFilter(a){
    const f = state.filter;
    if(f.overdueOnly && !isOverdue(a)) return false;
    if(f.approval !== '__ALL__' && (a.approvalStatus||'') !== f.approval) return false;
    if(f.execution !== '__ALL__' && (a.executionStatus||'') !== f.execution) return false;
    if(f.search){
      const q = f.search.toLowerCase();
      const hay = `${a.brand} ${a.product} ${a.notes}`.toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  }

  function render(){
    const app = document.getElementById('app');
    app.innerHTML = `<div class="topbar"></div>` + renderHeader() + renderTabs() +
      (state.activeTab === 'overview' ? renderOverview() : renderGroupView(state.activeTab));
    if(state.renamingGroupId){ const inp = app.querySelector('.tab-rename-input'); if(inp){ inp.focus(); inp.select(); } }
    if(state.justAddedId){ const inp = app.querySelector(`input[data-id="${state.justAddedId}"][data-field="brand"]`); if(inp) inp.focus(); state.justAddedId = null; }
  }

  function refreshGroupTable(){
    const el = document.getElementById('group-table-region');
    if(el) el.innerHTML = renderGroupTable(state.activeTab);
  }

  function renderHeader(){
    const lu = lastUpdated();
    const warning = !state.storageOk ? `<div class="storage-warning">Changes aren't saving right now — storage is unavailable in this preview.</div>` : '';
    return `
      <div class="header">
        <div>
          <h1 class="wordmark"><span class="dot"></span>Activation Board</h1>
          <div class="tagline">Live activation database — edit any field directly, everyone with this link sees the same board.</div>
        </div>
        <div class="sync-note"><span class="sync-dot ${state.storageOk?'':'warn'}"></span> ${state.storageOk ? 'LIVE &middot; updated ' + timeAgo(lu) : 'NOT SAVING'}</div>
      </div>
      ${warning}
    `;
  }

  function renderTabs(){
    let tabs = `<button class="tab ${state.activeTab==='overview'?'active':''}" data-tab="overview">Overview</button>`;
    state.groups.forEach(g => {
      if(state.renamingGroupId === g.id){
        tabs += `<span class="tab active"><input class="tab-rename-input" data-action="rename-group-input" data-id="${g.id}" value="${esc(g.name)}"></span>`;
      } else {
        tabs += `<button class="tab ${state.activeTab===g.id?'active':''}" data-tab="${g.id}">${esc(g.name)}<span class="tab-rename-btn" data-action="start-rename" data-id="${g.id}" role="button" tabindex="0">&#9998;</span></button>`;
      }
    });
    return `<div class="tabs">${tabs}</div>`;
  }

  function renderOverview(){
    const groupCounts = {};
    state.groups.forEach(g => groupCounts[g.id] = 0);
    state.activations.forEach(a => { if(groupCounts[a.groupId] !== undefined) groupCounts[a.groupId]++; });
    const groupCards = state.groups.map(g => `
      <div class="stat-card" style="border-left-color:${groupColor(g.id)}">
        <div class="stat-num">${groupCounts[g.id]}</div>
        <div class="stat-label">${esc(g.name)}</div>
      </div>`).join('');

    const execCounts = {'':0, 'To be Executed':0, 'Done':0};
    state.activations.forEach(a => { const k = EXECUTION_OPTIONS.includes(a.executionStatus)?a.executionStatus:''; execCounts[k] = (execCounts[k]||0)+1; });
    const overdueCount = state.activations.filter(isOverdue).length;
    const execCards = [
      {k:'', label:'Not started', cls:'c-grey'},
      {k:'To be Executed', label:'To be executed', cls:'c-amber'},
      {k:'Done', label:'Done', cls:'c-green'}
    ].map(x => `<div class="stat-card ${x.cls}"><div class="stat-num">${execCounts[x.k]}</div><div class="stat-label">${x.label}</div></div>`).join('') +
      `<div class="stat-card" style="border-left-color:var(--red)"><div class="stat-num" style="color:var(--red)">${overdueCount}</div><div class="stat-label">Overdue</div></div>`;

    const thisIdx = currentMonthIndex();
    const active = state.activations.filter(a => a.executionStatus !== 'Done').slice()
      .sort((a,b) => (a.month||'').localeCompare(b.month||''));

    const upcomingRows = active.length ? active.slice(0,25).map(a => {
      const idx = monthIndex(a.month);
      let tag = '', cls = '';
      if(idx !== null){
        const diff = idx - thisIdx;
        if(diff < 0){ tag = 'OVERDUE'; cls = 'overdue'; }
        else if(diff === 0){ tag = 'THIS MO'; cls = 'now'; }
        else { tag = `+${diff}mo`; cls = diff <= 1 ? 'soon' : ''; }
      }
      const bd = bdSummary(a.bdSkus);
      return `
        <div class="upcoming-row ${isOverdue(a)?'overdue':''}" data-action="goto-group" data-group="${a.groupId}">
          <span class="group-pill" style="background:${groupColor(a.groupId)}">${esc(groupName(a.groupId))}</span>
          <span class="row-main"><span class="brand">${esc(a.brand||'Untitled')}</span> &middot; <span class="name">${esc(a.product||'—')}</span></span>
          <span class="row-month">${monthLabel(a.month)}</span>
          <span class="badge as-${slug(a.approvalStatus)}">${a.approvalStatus||'No approval'}</span>
          <span class="badge es-${slug(a.executionStatus)}">${a.executionStatus||'Not started'}</span>
          <span class="countdown ${cls}">${tag}${bd.has?'<span class="bd-flag">BD</span>':''}</span>
        </div>`;
    }).join('') : `<div class="empty-note">Nothing outstanding — everything is marked Done.</div>`;

    const allRows = state.activations.slice().sort((a,b)=>(a.month||'').localeCompare(b.month||'')).map(a => {
      const bd = bdSummary(a.bdSkus);
      return `
      <tr class="${isOverdue(a)?'overdue':''}" data-action="goto-group" data-group="${a.groupId}">
        <td><span class="group-pill" style="background:${groupColor(a.groupId)}">${esc(groupName(a.groupId))}</span></td>
        <td>${esc(a.brand||'—')}</td>
        <td>${esc(a.product||'—')}</td>
        <td>${monthLabel(a.month)}</td>
        <td><span class="badge as-${slug(a.approvalStatus)}">${a.approvalStatus||'—'}</span></td>
        <td><span class="badge es-${slug(a.executionStatus)}">${a.executionStatus||'—'}</span></td>
        <td>${esc(bd.text)}</td>
      </tr>`;
    }).join('');

    return `
      <div class="stat-strip">${groupCards}</div>
      <div class="stat-strip">${execCards}</div>
      <div class="section-row">
        <h2 class="section-title">Outstanding activations</h2>
        <button class="btn secondary" data-action="export-csv">Export CSV</button>
      </div>
      <div class="upcoming-list">${upcomingRows}</div>
      <div class="section-row"><h2 class="section-title">All activations</h2></div>
      <div class="full-table-wrap">
        <table class="full-table">
          <thead><tr><th>Group</th><th>Brand</th><th>Product</th><th>Month</th><th>Approval</th><th>Execution</th><th>Bangladesh</th></tr></thead>
          <tbody>${allRows || '<tr><td colspan="7" style="color:var(--ink-soft);padding:16px;">Nothing here yet.</td></tr>'}</tbody>
        </table>
      </div>
    `;
  }

  function renderGroupTable(groupId){
    const allRows = state.activations.filter(a => a.groupId === groupId);
    const rows = allRows.filter(matchesFilter).sort((a,b)=>(a.month||'').localeCompare(b.month||''));

    const tableRows = rows.map(a => {
      const bd = bdSummary(a.bdSkus);
      const expanded = state.expanded.has(a.id);
      const overdue = isOverdue(a);
      let out = `
      <tr class="main-row ${overdue?'row-overdue':''}" data-id="${a.id}">
        <td class="col-brand">${overdue?'<span class="overdue-dot" title="Overdue"></span>':''}<input type="text" data-id="${a.id}" data-field="brand" value="${esc(a.brand)}" placeholder="Brand" aria-label="Brand"></td>
        <td class="col-product"><input type="text" data-id="${a.id}" data-field="product" value="${esc(a.product)}" placeholder="Product / activation" aria-label="Product"></td>
        <td><select data-id="${a.id}" data-field="month" aria-label="Month">${monthOptionsHtml(a.month)}</select></td>
        <td><input type="text" data-id="${a.id}" data-field="digital" value="${esc(a.digital)}" placeholder="—" aria-label="Digital"></td>
        <td><input type="text" data-id="${a.id}" data-field="magazine" value="${esc(a.magazine)}" placeholder="—" aria-label="Magazine"></td>
        <td><input type="text" data-id="${a.id}" data-field="outpost" value="${esc(a.outpost)}" placeholder="—" aria-label="Outpost"></td>
        <td><input type="text" data-id="${a.id}" data-field="window" value="${esc(a.window)}" placeholder="—" aria-label="Window"></td>
        <td><input type="text" data-id="${a.id}" data-field="kol" value="${esc(a.kol)}" placeholder="—" aria-label="KOL"></td>
        <td><input type="text" data-id="${a.id}" data-field="event" value="${esc(a.event)}" placeholder="—" aria-label="Event / MHA / Podium"></td>
        <td><input type="text" data-id="${a.id}" data-field="deck" value="${esc(a.deck)}" placeholder="—" aria-label="Deck"></td>
        <td><input type="text" data-id="${a.id}" data-field="tmDeck" value="${esc(a.tmDeck)}" placeholder="—" aria-label="TM Deck"></td>
        <td><select data-id="${a.id}" data-field="approvalStatus" class="status-select as-${slug(a.approvalStatus)}" aria-label="Approval status">${options(APPROVAL_OPTIONS, a.approvalStatus)}</select></td>
        <td><select data-id="${a.id}" data-field="executionStatus" class="status-select es-${slug(a.executionStatus)}" aria-label="Execution status">${options(EXECUTION_OPTIONS, a.executionStatus)}</select></td>
        <td><button class="bd-toggle ${bd.has?'has-bd':''}" data-action="toggle-bd" data-id="${a.id}">${expanded?'&#9660;':'&#9654;'} ${esc(bd.text)}</button></td>
        <td><input type="text" data-id="${a.id}" data-field="notes" value="${esc(a.notes)}" placeholder="—" aria-label="Notes"></td>
        <td><button class="del-btn" data-action="delete-activation" data-id="${a.id}" aria-label="Delete this activation">&times;</button></td>
      </tr>`;
      if(expanded){
        const skuRows = (a.bdSkus||[]).map(s => `
          <tr>
            <td><input type="text" data-id="${a.id}" data-sku-id="${s.id}" data-field="subtype" value="${esc(s.subtype)}" placeholder="Subtype"></td>
            <td><input type="text" data-id="${a.id}" data-sku-id="${s.id}" data-field="sku" value="${esc(s.sku)}" placeholder="SKU"></td>
            <td><input type="text" data-id="${a.id}" data-sku-id="${s.id}" data-field="ean" value="${esc(s.ean)}" placeholder="EAN"></td>
            <td><input type="text" data-id="${a.id}" data-sku-id="${s.id}" data-field="productName" value="${esc(s.productName)}" placeholder="Product name"></td>
            <td><input type="text" data-id="${a.id}" data-sku-id="${s.id}" data-field="value" value="${esc(s.value)}" placeholder="Qty or status"></td>
            <td><button class="del-btn" data-action="delete-sku" data-id="${a.id}" data-sku-id="${s.id}">&times;</button></td>
          </tr>`).join('');
        out += `
        <tr class="bd-detail-row"><td colspan="16">
          ${(a.bdSkus||[]).length ? `
          <table class="bd-detail-table">
            <thead><tr><th>Subtype</th><th>SKU</th><th>EAN</th><th>Product name</th><th>Qty in BD / Status</th><th></th></tr></thead>
            <tbody>${skuRows}</tbody>
          </table>` : `<div class="bd-empty">No Bangladesh SKU detail logged for this activation yet.</div>`}
          <div class="bd-add-row"><button class="btn secondary" data-action="add-sku" data-id="${a.id}">+ Add SKU</button></div>
        </td></tr>`;
      }
      return out;
    }).join('');

    if(!allRows.length){
      return `<div class="empty-note">No activations for this group yet — click "Add activation" to log the first one.</div>`;
    }
    if(!rows.length){
      return `<div class="empty-note">No activations match the current filters.</div>`;
    }
    return `
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>Brand</th><th>Product</th><th>Month</th><th>Digital</th><th>Magazine</th><th>Outpost</th><th>Window</th><th>KOL</th>
            <th>Event / MHA / Podium</th><th>Deck</th><th>TM Deck</th><th>Approval</th><th>Execution</th><th>Bangladesh</th><th>Notes</th><th></th>
          </tr></thead>
          <tbody>${tableRows}</tbody>
        </table>
      </div>`;
  }

  function renderGroupView(groupId){
    const g = state.groups.find(g => g.id === groupId);
    const allRows = state.activations.filter(a => a.groupId === groupId);
    const filteredCount = allRows.filter(matchesFilter).length;
    const overdueCount = allRows.filter(isOverdue).length;
    const f = state.filter;

    return `
      <div class="group-header">
        <div class="group-title-row">
          <h2 class="group-title">${esc(g.name)}</h2>
          <button class="icon-btn" data-action="start-rename" data-id="${g.id}" aria-label="Rename group">&#9998;</button>
          <span class="group-count">${allRows.length} activation${allRows.length===1?'':'s'}${overdueCount ? ` · <span class="warn">${overdueCount} overdue</span>` : ''}</span>
        </div>
        <button class="btn" data-action="add-activation" data-group="${g.id}">+ Add activation</button>
      </div>
      <div class="toolbar">
        <input type="text" data-filter="search" placeholder="Search brand, product, notes…" value="${esc(f.search)}">
        <select data-filter="approval">
          <option value="__ALL__" ${f.approval==='__ALL__'?'selected':''}>All approval</option>
          ${APPROVAL_OPTIONS.map(o=>`<option value="${esc(o)}" ${f.approval===o?'selected':''}>${o===''?'Not started':esc(o)}</option>`).join('')}
        </select>
        <select data-filter="execution">
          <option value="__ALL__" ${f.execution==='__ALL__'?'selected':''}>All execution</option>
          ${EXECUTION_OPTIONS.map(o=>`<option value="${esc(o)}" ${f.execution===o?'selected':''}>${o===''?'Not started':esc(o)}</option>`).join('')}
        </select>
        <label><input type="checkbox" data-filter="overdueOnly" ${f.overdueOnly?'checked':''}> Overdue only</label>
        ${(f.search || f.approval!=='__ALL__' || f.execution!=='__ALL__' || f.overdueOnly) ? `<button class="reset-link" data-action="reset-filters">Reset</button>` : ''}
        <span class="result-count">Showing ${filteredCount} of ${allRows.length}</span>
      </div>
      <div id="group-table-region">${renderGroupTable(groupId)}</div>
    `;
  }

  function updateActivation(id, field, val){
    const a = state.activations.find(a => a.id === id);
    if(!a) return;
    a[field] = val;
    a.updatedAt = new Date().toISOString();
    saveActivations();
    render();
  }
  function updateSku(id, skuId, field, val){
    const a = state.activations.find(a => a.id === id);
    if(!a) return;
    const s = (a.bdSkus||[]).find(s => s.id === skuId);
    if(!s) return;
    s[field] = val;
    a.updatedAt = new Date().toISOString();
    saveActivations();
    render();
  }
  function addActivation(groupId){
    const a = { id: uid('x'), groupId, brand:'', product:'', month:'', digital:'', magazine:'', outpost:'', window:'', kol:'', event:'', deck:'', tmDeck:'', approvalStatus:'', executionStatus:'', bdSkus:[], notes:'', updatedAt:new Date().toISOString() };
    state.activations.push(a);
    state.justAddedId = a.id;
    saveActivations();
    render();
  }
  function deleteActivation(id){
    const a = state.activations.find(a => a.id === id);
    if(!a) return;
    if(!confirm(`Delete "${a.product || a.brand || 'this activation'}"? This can't be undone.`)) return;
    state.activations = state.activations.filter(x => x.id !== id);
    saveActivations();
    render();
  }
  function addSku(id){
    const a = state.activations.find(a => a.id === id);
    if(!a) return;
    if(!a.bdSkus) a.bdSkus = [];
    a.bdSkus.push({id: uid('s'), subtype:'', sku:'', ean:'', productName:'', value:''});
    saveActivations();
    render();
  }
  function deleteSku(id, skuId){
    const a = state.activations.find(a => a.id === id);
    if(!a) return;
    a.bdSkus = (a.bdSkus||[]).filter(s => s.id !== skuId);
    saveActivations();
    render();
  }
  function renameGroup(id, newName){
    state.renamingGroupId = null;
    if(newName){ const g = state.groups.find(g => g.id === id); if(g) g.name = newName; saveGroups(); }
    render();
  }

  function exportCsv(){
    const headers = ['Group','Brand','Product','Month','Digital','Magazine','Outpost','Window','KOL','Event/MHA/Podium','Deck','TM Deck','Approval Status','Execution Status','Bangladesh Detail','Notes'];
    const rows = state.activations.map(a => [
      groupName(a.groupId), a.brand, a.product, monthLabel(a.month), a.digital, a.magazine, a.outpost, a.window, a.kol, a.event,
      a.deck, a.tmDeck, a.approvalStatus, a.executionStatus,
      (a.bdSkus||[]).map(s => `${s.subtype} ${s.sku} ${s.productName}: ${s.value}`).join(' | '),
      a.notes
    ]);
    const csvEscape = v => `"${String(v ?? '').replace(/"/g,'""')}"`;
    const csv = [headers, ...rows].map(r => r.map(csvEscape).join(',')).join('\n');
    const blob = new Blob([csv], {type:'text/csv'});
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url; link.download = 'activation-board.csv';
    document.body.appendChild(link); link.click(); document.body.removeChild(link);
    URL.revokeObjectURL(url);
  }

  const app = document.getElementById('app');

  app.addEventListener('input', e => {
    const el = e.target;
    if(el.matches('[data-filter="search"]')){
      state.filter.search = el.value;
      refreshGroupTable();
      const allRows = state.activations.filter(a => a.groupId === state.activeTab);
      const filteredCount = allRows.filter(matchesFilter).length;
      const countEl = document.querySelector('.result-count');
      if(countEl) countEl.textContent = `Showing ${filteredCount} of ${allRows.length}`;
    }
  });

  app.addEventListener('change', e => {
    const el = e.target;
    if(el.matches('[data-filter]') && el.dataset.filter !== 'search'){
      const key = el.dataset.filter;
      state.filter[key] = el.type === 'checkbox' ? el.checked : el.value;
      render();
      return;
    }
    if(el.matches('[data-sku-id]')){
      updateSku(el.dataset.id, el.dataset.skuId, el.dataset.field, el.value);
    } else if(el.matches('[data-field]')){
      updateActivation(el.dataset.id, el.dataset.field, el.value);
    } else if(el.matches('[data-action="rename-group-input"]')){
      renameGroup(el.dataset.id, el.value.trim());
    }
  });

  app.addEventListener('click', e => {
    const tabBtn = e.target.closest('[data-tab]');
    if(tabBtn){ state.activeTab = tabBtn.dataset.tab; state.filter = { search:'', approval:'__ALL__', execution:'__ALL__', overdueOnly:false }; render(); return; }
    const renameBtn = e.target.closest('[data-action="start-rename"]');
    if(renameBtn){ state.renamingGroupId = renameBtn.dataset.id; render(); return; }
    const addBtn = e.target.closest('[data-action="add-activation"]');
    if(addBtn){ addActivation(addBtn.dataset.group); return; }
    const delBtn = e.target.closest('[data-action="delete-activation"]');
    if(delBtn){ deleteActivation(delBtn.dataset.id); return; }
    const toggleBd = e.target.closest('[data-action="toggle-bd"]');
    if(toggleBd){ const id = toggleBd.dataset.id; state.expanded.has(id) ? state.expanded.delete(id) : state.expanded.add(id); refreshGroupTable(); return; }
    const addSkuBtn = e.target.closest('[data-action="add-sku"]');
    if(addSkuBtn){ addSku(addSkuBtn.dataset.id); return; }
    const delSkuBtn = e.target.closest('[data-action="delete-sku"]');
    if(delSkuBtn){ deleteSku(delSkuBtn.dataset.id, delSkuBtn.dataset.skuId); return; }
    const exportBtn = e.target.closest('[data-action="export-csv"]');
    if(exportBtn){ exportCsv(); return; }
    const resetBtn = e.target.closest('[data-action="reset-filters"]');
    if(resetBtn){ state.filter = { search:'', approval:'__ALL__', execution:'__ALL__', overdueOnly:false }; render(); return; }
    const gotoRow = e.target.closest('[data-action="goto-group"]');
    if(gotoRow && !e.target.matches('input,select')){ state.activeTab = gotoRow.dataset.group; state.filter = { search:'', approval:'__ALL__', execution:'__ALL__', overdueOnly:false }; render(); return; }
  });

  app.addEventListener('keydown', e => {
    if(e.key === 'Enter' && e.target.matches('input,select')){ e.target.blur(); }
    if(e.key === 'Escape' && e.target.dataset.action === 'rename-group-input'){ state.renamingGroupId = null; render(); }
  });

  init();
})();
</script>
</body>
</html>
